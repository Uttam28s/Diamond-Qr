<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>Diamond QR</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #ffffff;
        border: 1px solid #e4e7ec;
        border-radius: 10px;
        font: 13px "Segoe UI", system-ui, sans-serif;
        color: #101828;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { font-size: 12px; color: #667085; }
      .bar { width: 190px; height: 3px; border-radius: 3px; background: #eef2f6; overflow: hidden; }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #0f5c8c;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div class="title">Diamond QR</div>
    <div class="sub">Verifying licence...</div>
    <div class="bar"><i></i></div>
  </body>
</html>
